<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<meta name="robots" content="noindex">
<title>AI Biz · Giọng đọc</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F4F5FA;color:#1B1F3B}
a{color:#1B1F3B;text-decoration:none}a:hover{color:#4F46E5}
</style>

<style></style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B1F3B; background: #F4F5FA">
<nav aria-label="Điều hướng" style="flex: 0 0 240px; background: #FFFFFF; border-right: 1px solid #E6E8F0; padding: 22px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 20px"><span style="width: 40px; height: 40px; border-radius: 13px; background: #4F46E5; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">AB</span><span style="font-size: 19px; font-weight: 800; color: #1B1F3B; letter-spacing: -0.02em">AI Biz</span></div>
<a href="Main.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #3A3F5C; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #EEEDFD; color: #4F46E5"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg></span>Trợ lý AI</a>
<a href="Social.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; background: #EEEDFD; color: #3730A3; font-weight: 700"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #FDE8EE; color: #E0436B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M21 16l-5-5-8 8"></path></svg></span>Phòng Media</a>
<a href="Schedule.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #3A3F5C; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #E6EFFE; color: #2F6FE0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"></path><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"></path></svg></span>Phòng Marketing</a>
<a href="Web.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #3A3F5C; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #E0F5F1; color: #0F8F7F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path><path d="M9 8l-2 2 2 2M15 8l2 2-2 2"></path></svg></span>Phòng IT</a>
<a href="Care.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #3A3F5C; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #FDF1DC; color: #B86E00"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13v-1a8 8 0 0 1 16 0v1"></path><rect x="3" y="13" width="4" height="6" rx="1.5"></rect><rect x="17" y="13" width="4" height="6" rx="1.5"></rect><path d="M19 19a3 3 0 0 1-3 3h-3"></path></svg></span>Chăm sóc khách</a>
<div style="height: 1px; background: #E6E8F0; margin: 10px 8px"></div>
<a href="Plans.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #3A3F5C; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #ECEEF5; color: #1B1F3B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18"></path></svg></span>Gói và credit</a>
<a href="Onboarding.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #3A3F5C; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #ECEEF5; color: #1B1F3B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>Hồ sơ của tôi</a>
<div style="flex-grow: 1; min-height: 20px"></div>
<a href="Plans.html" style="display: flex; flex-direction: column; gap: 4px; border-radius: 18px; background: #1B1F3B; color: #FFFFFF; padding: 16px; font-size: 13px; line-height: 1.45"><span style="font-size: 15px; font-weight: 700">Bản miễn phí</span><span style="color: #C7CAE0">Nâng cấp để chat và chỉnh mọi thứ theo ý.</span></a>
</nav>
<main style="flex: 999 1 560px; min-width: 0; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 14px"><span style="width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex: none; background: #FDE8EE; color: #E0436B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M21 16l-5-5-8 8"></path></svg></span><h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em">Giọng đọc</h1></div>
<p style="margin: 0; font-size: 15px; color: #5A5F7D">Chọn một giọng có sẵn, hoặc tạo giọng riêng từ chính giọng của bạn.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="Social.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D9DCEA; color: #1B1F3B; font-size: 14px; font-weight: 500">Bài viết</a>
<a href="Photo.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D9DCEA; color: #1B1F3B; font-size: 14px; font-weight: 500">Công cụ ảnh</a>
<a href="Video.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D9DCEA; color: #1B1F3B; font-size: 14px; font-weight: 500">Tạo video</a>
<a href="Voice.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #4F46E5; border: 1px solid #4F46E5; color: #FFFFFF; font-size: 14px; font-weight: 600">Giọng đọc</a>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #E6E8F0; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Giọng có sẵn</h2>
<sc-for list="{{ voices }}" as="v" hint-placeholder-count="4">
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 14px; background: #F4F5FA; border: 2px solid {{ v.bd }}">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 15px; font-weight: 600">{{ v.name }}</div>
<div style="font-size: 13px; color: #5A5F7D">{{ v.desc }}</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{ v.listen }}" style="min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #D9DCEA; background: #FFFFFF; color: #1B1F3B; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Nghe thử</button>
<button type="button" onClick="{{ v.choose }}" aria-pressed="{{ v.on }}" style="min-height: 44px; padding: 0 14px; border-radius: 12px; border: none; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: {{ v.btnBg }}; color: {{ v.btnFg }}">{{ v.btn }}</button>
</div>
</div>
</sc-for>
<sc-if value="{{ heard }}" hint-placeholder-val="{{ false }}">
<div style="font-size: 13px; color: #5A5F7D">Bản prototype chưa phát âm thanh. Bản thật sẽ đọc một câu mẫu bằng giọng bạn bấm.</div>
</sc-if>
</section>
<section style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #E6E8F0; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Giọng của tôi</h2>
<div style="font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #EEEDFD; color: #3730A3">Gói Pro và Max</div>
</div>
<div style="font-size: 13px; font-weight: 600; color: #5A5F7D">{{ stepLabel }}</div>
<sc-if value="{{ s0 }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 15px; line-height: 1.55">Bạn đọc hai đoạn ngắn trên điện thoại, mất khoảng một phút. Sau đó mọi video đều đọc bằng giọng của bạn.</p>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5A5F7D">Chỉ tạo được giọng của chính bạn. Mỗi tài khoản một giọng, xóa được bất cứ lúc nào.</p>
<button type="button" onClick="{{ next }}" style="align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 12px; border: none; background: #4F46E5; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Bắt đầu</button>
</div>
</sc-if>
<sc-if value="{{ s1 }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 14px; color: #5A5F7D">Đọc to câu xác nhận dưới đây. Mỗi lần hệ thống đưa một câu khác nhau.</p>
<div style="padding: 16px; border-radius: 14px; background: #F4F5FA; font-size: 18px; font-weight: 600; line-height: 1.5">"Tôi là Minh Anh, đây là giọng của tôi. Mã xác nhận: bốn, bảy, hai, chín."</div>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; min-height: 44px"><input type="checkbox" checked="{{ agree }}" onChange="{{ toggleAgree }}" style="width: 20px; height: 20px">Tôi cam kết đây là giọng của chính tôi.</label>
<sc-if value="{{ warn }}" hint-placeholder-val="{{ false }}">
<div style="font-size: 14px; font-weight: 600; color: #3730A3">Bạn cần đánh dấu cam kết trước khi tiếp tục.</div>
</sc-if>
<button type="button" onClick="{{ confirm }}" style="align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 12px; border: none; background: #4F46E5; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Tôi đã đọc xong</button>
</div>
</sc-if>
<sc-if value="{{ s2 }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 14px; color: #5A5F7D">Đọc đoạn mẫu với giọng tự nhiên, ở nơi yên tĩnh.</p>
<div style="padding: 16px; border-radius: 14px; background: #F4F5FA; font-size: 16px; line-height: 1.6">"Chào các chị, em là Minh Anh. Hôm nay em chia sẻ ba bước dưỡng da buổi tối mà ai cũng làm được ở nhà, không cần nhiều sản phẩm và không mất quá năm phút."</div>
<button type="button" onClick="{{ next }}" style="align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 12px; border: none; background: #4F46E5; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Thu xong, tạo giọng</button>
</div>
</sc-if>
<sc-if value="{{ s3 }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="padding: 16px; border-radius: 14px; background: #DDF1EC; color: #12584E; font-size: 16px; font-weight: 600">Giọng của bạn đã sẵn sàng và có trong mục Tạo video.</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<a href="Video.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #4F46E5; color: #FFFFFF; font-size: 14px; font-weight: 600">Tạo video bằng giọng này</a>
<button type="button" onClick="{{ reset }}" style="min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #D9DCEA; background: #FFFFFF; color: #1B1F3B; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Xóa giọng</button>
</div>
</div>
</sc-if>
</section>
</div>
<section style="background: #FFFFFF; border: 1px solid #E6E8F0; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Từ điển cách đọc</h2>
<p style="margin: 0; font-size: 14px; color: #5A5F7D">Phụ đề hiện chữ ở cột trái, giọng đọc theo cột phải. Dùng cho tên riêng và tên sản phẩm tiếng Anh.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; font-size: 15px">
<div style="font-size: 13px; font-weight: 600; color: #5A5F7D">Chữ hiển thị</div>
<div style="font-size: 13px; font-weight: 600; color: #5A5F7D">Cách đọc</div>
<sc-for list="{{ words }}" as="w" hint-placeholder-count="3">
<div style="padding: 10px 12px; border-radius: 8px; background: #F4F5FA">{{ w.show }}</div>
<div style="padding: 10px 12px; border-radius: 8px; background: #F4F5FA">{{ w.say }}</div>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end">
<div style="flex: 1 1 180px; display: flex; flex-direction: column; gap: 4px">
<label for="vw-show" style="font-size: 13px; color: #5A5F7D">Chữ hiển thị</label>
<input id="vw-show" type="text" value="{{ draftShow }}" onChange="{{ typeShow }}" style="min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #D9DCEA; font-family: inherit; font-size: 15px; box-sizing: border-box; width: 100%">
</div>
<div style="flex: 1 1 180px; display: flex; flex-direction: column; gap: 4px">
<label for="vw-say" style="font-size: 13px; color: #5A5F7D">Cách đọc</label>
<input id="vw-say" type="text" value="{{ draftSay }}" onChange="{{ typeSay }}" style="min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #D9DCEA; font-family: inherit; font-size: 15px; box-sizing: border-box; width: 100%">
</div>
<button type="button" onClick="{{ addWord }}" style="min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1.5px solid #D9DCEA; background: #FFFFFF; color: #1B1F3B; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Thêm</button>
</div>
</section>
</main>
</div>
</template>
<a href="./" style="position:fixed;right:16px;bottom:16px;z-index:50;display:flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:#1B1F3B;color:#fff;font:600 13px 'Plus Jakarta Sans',system-ui,sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(27,31,59,.25)">Danh sách màn hình</a>
<script src="dc-runtime.js"></script>
<script>

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { chosen: 0, heard: false, step: 0, agree: false, warn: false, draftShow: '', draftSay: '', words: [{ show: 'AI Biz', say: 'ây ai bít' }, { show: 'QR', say: 'quy a' }, { show: 'Zoom', say: 'dum' }] };
}
renderVals() {
var self = this;
var voices = [
{ name: 'Mai', desc: 'Nữ, miền Bắc, ấm và chậm' },
{ name: 'Linh', desc: 'Nữ, miền Nam, tươi' },
{ name: 'Quân', desc: 'Nam, miền Bắc, điềm tĩnh' },
{ name: 'Huy', desc: 'Nam, miền Nam, thân thiện' }
];
var step = this.state.step;
var labels = ['Chưa có giọng riêng', 'Bước 1 trên 2 · Câu xác nhận', 'Bước 2 trên 2 · Đoạn mẫu 30 giây', 'Đã tạo giọng'];
return {
voices: voices.map(function (v, i) {
var on = i === self.state.chosen;
return { name: v.name, desc: v.desc, on: on, bd: on ? '#4F46E5' : '#F4F5FA', btn: on ? 'Đang dùng' : 'Chọn giọng này', btnBg: on ? '#DDF1EC' : '#1B1F3B', btnFg: on ? '#12584E' : '#FFFFFF', listen: function () { self.setState({ heard: true }); }, choose: function () { self.setState({ chosen: i }); } };
}),
heard: this.state.heard,
stepLabel: labels[step],
s0: step === 0, s1: step === 1, s2: step === 2, s3: step === 3,
agree: this.state.agree,
warn: this.state.warn,
toggleAgree: function (e) { self.setState({ agree: e.target.checked, warn: false }); },
next: function () { self.setState({ step: Math.min(3, self.state.step + 1) }); },
confirm: function () { if (self.state.agree) { self.setState({ step: 2, warn: false }); } else { self.setState({ warn: true }); } },
reset: function () { self.setState({ step: 0, agree: false, warn: false }); },
words: this.state.words,
draftShow: this.state.draftShow,
draftSay: this.state.draftSay,
typeShow: function (e) { self.setState({ draftShow: e.target.value }); },
typeSay: function (e) { self.setState({ draftSay: e.target.value }); },
addWord: function () {
var a = (self.state.draftShow || '').trim(), b = (self.state.draftSay || '').trim();
if (!a || !b) return;
self.setState({ words: self.state.words.concat([{ show: a, say: b }]), draftShow: '', draftSay: '' });
}
};
}
}

__dcStart(Component);
</script>
</body>
</html>
