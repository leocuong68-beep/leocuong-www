<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F8F6F1;color:#18232D}
</style>

<body>

<div style="background: #081D31; color: #DBE6EA; padding: 0 24px; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase">[Tên thương hiệu]</div>
<a href="#dk" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #5E7386; color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none">Đăng ký trao đổi</a>
</div>
<div style="background: linear-gradient(116deg, #081D31, #102F49 60%, #9B7A42); color: #FFFFFF; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #E1B75E">Giải pháp cho chủ tiệm làm đẹp</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.2">[Một câu hỏi chạm đúng nỗi lo lớn nhất của khách]</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #DBE6EA">[Một câu về hướng nhìn mới.]</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<a href="#dk" style="display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: 10px; background: #E1B75E; color: #16232C; font-size: 15px; font-weight: 700; text-decoration: none">Tôi muốn được tư vấn</a>
</div>
<div style="aspect-ratio: 16 / 9; border-radius: 14px; background: #0B2238; color: #DBE6EA; display: flex; align-items: center; justify-content: center; font-size: 13px; text-align: center; padding: 12px; box-sizing: border-box">Video giới thiệu 2 phút của bạn</div>
</div>
<div style="background: #FFFFFF; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.25">Ba mục tiêu. Một chiến lược.</h2>
<div>
<div style="display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid #E3DED2"><div style="flex: 0 0 132px; font-size: 15px; font-weight: 700">Tạo sức hút</div><div style="font-size: 14px; line-height: 1.45; color: #4A5568">Thêm khách mới.</div></div>
<div style="display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid #E3DED2"><div style="flex: 0 0 132px; font-size: 15px; font-weight: 700">Xây dựng gắn bó</div><div style="font-size: 14px; line-height: 1.45; color: #4A5568">Khách cũ quay lại.</div></div>
<div style="display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid #E3DED2"><div style="flex: 0 0 132px; font-size: 15px; font-weight: 700">Tăng giá trị</div><div style="font-size: 14px; line-height: 1.45; color: #4A5568">Mỗi lượt đến đáng giá hơn.</div></div>
</div>
</div>
<div style="padding: 20px 24px; font-size: 14px; line-height: 1.5; color: #4A5568"><span style="font-weight: 700; color: #18232D">Ba bước:</span> đăng ký, chọn giờ, trao đổi riêng 20 phút.</div>
<div id="dk" style="background: #EFE3CC; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.25">Đăng ký trao đổi</h2>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="lp-name" style="font-size: 13px; font-weight: 600">Tên của bạn</label><input id="lp-name" type="text" placeholder="Nguyễn Thị A" style="min-height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9C2B2; font-family: inherit; font-size: 15px; box-sizing: border-box; width: 100%"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="lp-wa" style="font-size: 13px; font-weight: 600">Số WhatsApp</label><input id="lp-wa" type="text" placeholder="+1 ..." style="min-height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9C2B2; font-family: inherit; font-size: 15px; box-sizing: border-box; width: 100%"></div>
<button type="button" style="min-height: 48px; border-radius: 10px; border: none; background: #081D31; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Gửi đăng ký</button>
</div>
<div style="flex-grow: 1"></div>
<div style="background: #061522; color: #DBE6EA; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; font-size: 14px">
<div style="font-size: 16px; font-weight: 700; color: #FFFFFF">[Tên] · [Chức danh]</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #5E7386">Nhắn WhatsApp</span><span style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #5E7386">Gọi trực tiếp</span><span style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #5E7386">Facebook</span>
</div>
<div style="font-size: 12px; color: #9FB0BD">Trang không cam kết doanh thu hay thu nhập.</div>
</div>
</div>
</template>
