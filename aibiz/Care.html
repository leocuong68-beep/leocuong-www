<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<meta name="robots" content="noindex">
<title>AI Biz · Chăm sóc khách</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Barlow+Condensed:wght@700;800&display=swap">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#070C16;color:#EEF4FA}
a{color:#EEF4FA;text-decoration:none}a:hover{color:#2DE2D0}
</style>

<style></style>
<style>h1{font-family:"Barlow Condensed",sans-serif!important;text-transform:uppercase;letter-spacing:.01em}body{background:#070C16}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #EEF4FA; background: #070C16">
<nav aria-label="Điều hướng" style="flex: 0 0 240px; background: #0F1727; border-right: 1px solid #1C2940; padding: 22px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 20px"><span style="width: 40px; height: 40px; border-radius: 13px; background: #2DE2D0; color: #04201D; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">AB</span><span style="font-size: 19px; font-weight: 800; color: #EEF4FA; letter-spacing: -0.02em">AI Biz</span></div>
<a href="Main.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #12302F; color: #2DE2D0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg></span>Trợ lý AI</a>
<a href="Social.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #3A1A26; color: #FF7A9C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M21 16l-5-5-8 8"></path></svg></span>Phòng Media</a>
<a href="Schedule.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #16264A; color: #7FB0FF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"></path><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"></path></svg></span>Phòng Marketing</a>
<a href="Web.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #0F3330; color: #43E6CC"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path><path d="M9 8l-2 2 2 2M15 8l2 2-2 2"></path></svg></span>Phòng IT</a>
<a href="Care.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; background: #12302F; color: #7FF3E6; font-weight: 700"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #3A2C12; color: #FFC453"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13v-1a8 8 0 0 1 16 0v1"></path><rect x="3" y="13" width="4" height="6" rx="1.5"></rect><rect x="17" y="13" width="4" height="6" rx="1.5"></rect><path d="M19 19a3 3 0 0 1-3 3h-3"></path></svg></span>Chăm sóc khách</a>
<div style="height: 1px; background: #1C2940; margin: 10px 8px"></div>
<a href="Plans.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #1A2638; color: #EEF4FA"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18"></path></svg></span>Gói và credit</a>
<a href="Onboarding.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #1A2638; color: #EEF4FA"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>Hồ sơ của tôi</a>
<div style="flex-grow: 1; min-height: 20px"></div>
<a href="Plans.html" style="display: flex; flex-direction: column; gap: 4px; border-radius: 18px; background: #16223A; color: #FFFFFF; padding: 16px; font-size: 13px; line-height: 1.45"><span style="font-size: 15px; font-weight: 700">Bản miễn phí</span><span style="color: #8FA3BF">Nâng cấp để chat và chỉnh mọi thứ theo ý.</span></a>
</nav>
<main style="flex: 999 1 560px; min-width: 0; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 14px"><span style="width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex: none; background: #3A2C12; color: #FFC453"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13v-1a8 8 0 0 1 16 0v1"></path><rect x="3" y="13" width="4" height="6" rx="1.5"></rect><rect x="17" y="13" width="4" height="6" rx="1.5"></rect><path d="M19 19a3 3 0 0 1-3 3h-3"></path></svg></span><h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em">Bình luận và nhắc chăm sóc</h1></div>
<p style="margin: 0; font-size: 15px; color: #8FA3BF">Trợ lý soạn câu trả lời kèm link trang đăng ký. Bạn bấm gửi, hoặc bật tự trả lời ở gói cao.</p>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="Care.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #2DE2D0; border: 1px solid #2DE2D0; color: #04201D; font-size: 14px; font-weight: 600">Bình luận và nhắc chăm sóc</a>
<a href="Leads.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #0F1727; border: 1px solid #2B3B57; color: #EEF4FA; font-size: 14px; font-weight: 500">Sổ khách</a>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{ stats }}" as="k" hint-placeholder-count="4">
<div style="background: #0F1727; border: 1px solid #1C2940; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px; gap: 4px; padding: 16px">
<div style="font-size: 13px; color: #8FA3BF">{{ k.label }}</div>
<div style="font-size: 28px; font-weight: 700">{{ k.value }}</div>
</div>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section style="flex: 3 1 460px; min-width: 0; background: #0F1727; border: 1px solid #1C2940; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Bình luận chờ trả lời</h2>
<label style="display: flex; gap: 8px; align-items: center; font-size: 14px; min-height: 44px"><input type="checkbox" checked="{{ auto }}" onChange="{{ toggleAuto }}" style="width: 20px; height: 20px">Tự trả lời câu hỏi giá và cách mua</label>
</div>
<sc-if value="{{ autoLocked }}" hint-placeholder-val="{{ false }}">
<div style="padding: 10px 14px; border-radius: 12px; background: #12302F; font-size: 14px">Tự trả lời có từ gói Pro. Bản miễn phí: trợ lý soạn sẵn, bạn bấm gửi. <a href="Plans.html" style="font-weight: 700; text-decoration: underline">Xem gói</a></div>
</sc-if>
<sc-for list="{{ comments }}" as="c" hint-placeholder-count="3">
<div style="padding: 14px; border-radius: 14px; background: #070C16; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between">
<div style="font-size: 14px"><span style="font-weight: 700">{{ c.name }}</span> · {{ c.where }}</div>
<div style="font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: {{ c.tagBg }}; color: {{ c.tagFg }}">{{ c.tag }}</div>
</div>
<div style="font-size: 15px">"{{ c.text }}"</div>
<div style="padding: 10px 12px; border-radius: 12px; background: #0F1727; border: 1px solid #1C2940; font-size: 14px; line-height: 1.5">{{ c.reply }}</div>
<sc-if value="{{ c.open }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{ c.send }}" style="min-height: 44px; padding: 0 14px; border-radius: 12px; border: none; background: #2DE2D0; color: #04201D; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Gửi trả lời</button>
<button type="button" onClick="{{ c.skip }}" style="min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #2B3B57; background: #0F1727; color: #EEF4FA; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Bỏ qua</button>
</div>
</sc-if>
</div>
</sc-for>
<div style="font-size: 13px; line-height: 1.5; color: #8FA3BF">Gửi trả lời trực tiếp trên Facebook Page, Instagram và YouTube. Kênh khác: trợ lý soạn sẵn để bạn dán.</div>
</section>
<section style="flex: 2 1 300px; min-width: 0; background: #0F1727; border: 1px solid #1C2940; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Nhắc bạn chăm sóc</h2>
<sc-for list="{{ reminders }}" as="r" hint-placeholder-count="3">
<div style="padding: 12px 14px; border-radius: 14px; background: #070C16; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 15px; font-weight: 700">{{ r.name }}</div>
<div style="font-size: 14px; color: #8FA3BF">{{ r.why }}</div>
<sc-if value="{{ r.open }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ r.done }}" style="align-self: flex-start; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #2B3B57; background: #0F1727; color: #EEF4FA; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{ r.btn }}</button>
</sc-if>
<sc-if value="{{ r.closed }}" hint-placeholder-val="{{ false }}">
<div style="font-size: 13px; font-weight: 700; color: #5EF0B8">Đã xong</div>
</sc-if>
</div>
</sc-for>
<a href="Leads.html" style="align-self: flex-start; display: flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 600; text-decoration: underline">Mở Sổ khách</a>
</section>
</div>
</main>
</div>
</template>
<a href="./" style="position:fixed;right:16px;bottom:16px;z-index:50;display:flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background: #16223A;color:#fff;font:600 13px 'Be Vietnam Pro',system-ui,sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(27,31,59,.25)">Danh sách màn hình</a>
<script src="dc-runtime.js"></script>
<script>

class Component extends DCLogic {
constructor(props) { super(props); this.state = { auto: false, autoLocked: false, cm: ['open', 'open', 'open'], rm: [false, false, false] }; }
renderVals() {
var self = this, st = this.state;
var link = 'minhanh.[tên miền]/qua-tang';
var comments = [
{ name: 'Thu Trang', where: 'Facebook Page · 12 phút trước', text: 'Giá bộ này bao nhiêu vậy em?', reply: 'Dạ chị Trang, em gửi chị bảng giá và quà tặng cẩm nang dưỡng da ở đây nha: ' + link },
{ name: 'Lan Phạm', where: 'Instagram · 1 giờ trước', text: 'Da dầu dùng được không bạn?', reply: 'Dùng được chị ơi. Em có bài hướng dẫn riêng cho da dầu, chị xem ở đây: ' + link },
{ name: 'Hồng Nhung', where: 'Facebook Page · 3 giờ trước', text: 'Mua ở đâu vậy?', reply: 'Dạ chị để lại thông tin ở đây, em nhắn chị cách mua và ưu đãi tuần này nha: ' + link }
];
var tags = { open: { t: 'Chờ trả lời', bg: '#12302F', fg: '#7FF3E6' }, sent: { t: 'Đã trả lời', bg: '#0F3329', fg: '#5EF0B8' }, skip: { t: 'Bỏ qua', bg: '#1A2638', fg: '#8FA3BF' } };
function setC(i, v) { var a = self.state.cm.slice(); a[i] = v; self.setState({ cm: a }); }
var reminders = [
{ name: 'Chị Hương', why: 'Để lại số điện thoại hôm qua, chưa liên hệ', btn: 'Đã gọi' },
{ name: 'Anh Tuấn', why: 'Hẹn gọi lại hôm nay lúc 19:00', btn: 'Đã gọi' },
{ name: 'Chị Lan', why: 'Mua được 30 ngày, nên hỏi thăm', btn: 'Đã nhắn' }
];
var waiting = st.cm.filter(function (x) { return x === 'open'; }).length + 2;
return {
stats: [{ label: 'Bình luận chờ', value: String(waiting) }, { label: 'Đã trả lời tuần này', value: '18' }, { label: 'Link trang đã gửi', value: '9' }, { label: 'Khách mới từ bình luận', value: '3' }],
auto: st.auto, autoLocked: st.autoLocked,
toggleAuto: function () { self.setState({ auto: false, autoLocked: true }); },
comments: comments.map(function (c, i) { var t = tags[st.cm[i]]; return { name: c.name, where: c.where, text: c.text, reply: c.reply, tag: t.t, tagBg: t.bg, tagFg: t.fg, open: st.cm[i] === 'open', send: function () { setC(i, 'sent'); }, skip: function () { setC(i, 'skip'); } }; }),
reminders: reminders.map(function (r, i) { return { name: r.name, why: r.why, btn: r.btn, open: !st.rm[i], closed: st.rm[i], done: function () { var a = self.state.rm.slice(); a[i] = true; self.setState({ rm: a }); } }; })
};
}
}

__dcStart(Component);
</script>
</body>
</html>
