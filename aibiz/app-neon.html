<style>
:root{--ink:#EEF4FA;--mut:#8FA3BF;--line:#1C2940;--line2:#2B3B57;--bg:#070C16;--card:#0F1727;--card2:#142035;--pri:#2DE2D0;--pri2:rgba(45,226,208,.14);--glow:0 0 22px rgba(45,226,208,.45);--pink:#FF8A9A;--pinkS:rgba(255,138,154,.13);--blue:#7FB0FF;--blueS:rgba(127,176,255,.13);--teal:#43E6CC;--tealS:rgba(67,230,204,.12);--amb:#FFC453;--ambS:rgba(255,196,83,.13);--ok:#5EF0B8;--okS:rgba(94,240,184,.12)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 70% -10%,#0B3A44,#04070E 60%)}
button{font-family:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #7FF3E6;outline-offset:2px}
.stage{min-height:100%;display:flex;align-items:flex-start;justify-content:center;gap:48px;padding:28px 16px}
.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;box-shadow:0 0 0 10px #16223A,0 0 60px rgba(45,226,208,.25),0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;display:flex;flex-direction:column}
.side{max-width:340px;padding-top:40px}
.side h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 12px}
.side p{color:var(--mut);line-height:1.6;margin:0 0 12px}
.side a{color:var(--pri);font-weight:700}
@media (max-width:820px){.stage{padding:0;display:block}.side{display:none}.phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
.top{padding:14px 18px 10px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:60px}
.top .back{width:40px;height:40px;border-radius:12px;border:none;background:var(--bg);display:flex;align-items:center;justify-content:center}
.top h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1}
.chipc{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--pri2);color:#7FF3E6}
.scroll{flex:1;overflow-y:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom))}
.tab{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mut);min-height:52px;justify-content:center}
.tab.on{color:var(--pri);font-weight:800}
.tab .plus{width:46px;height:46px;border-radius:16px;background:var(--pri);color:#04201D;display:flex;align-items:center;justify-content:center;margin-top:-6px;box-shadow:0 6px 14px rgba(79,70,229,.35)}
.scroll>*{flex-shrink:0}
.post .prod{font-size:clamp(7px,2.4vw,11px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.h{font-size:15px;font-weight:800;margin:0}
.sub{font-size:13px;color:var(--mut);line-height:1.5;margin:0}
.btn{min-height:50px;border-radius:16px;border:none;background:var(--pri);color:#04201D;font-size:16px;font-weight:800;width:100%}
.btn2{min-height:44px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);font-size:14px;font-weight:700;padding:0 14px}
.row{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);font-size:13.5px;font-weight:600;color:var(--ink)}
.pill.on{background:var(--pri);border-color:var(--pri);color:#04201D}
.tag{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.ico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.big{border:none;text-align:left;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.big b{font-size:17px}
.big span{font-size:13px;line-height:1.45;color:#CDBFD9}
.thumb{border-radius:12px;flex:none;display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:10px;font-weight:700}
.prog{height:8px;border-radius:4px;background:#1A2638;overflow:hidden}.prog i{display:block;height:100%;background:var(--pri);border-radius:4px;transition:width .4s}
.step{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.dot{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.chat{display:flex;flex-direction:column;gap:8px}
.me{align-self:flex-end;background:var(--pri);color:#04201D;padding:10px 14px;border-radius:18px 18px 6px 18px;font-size:14.5px;max-width:85%}
.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:18px 18px 18px 6px;font-size:14.5px;line-height:1.5;max-width:88%}
.inp{display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--line2);border-radius:16px;padding:5px 5px 5px 14px}
.inp input{flex:1;border:none;outline:none;font:inherit;font-size:15px;min-height:42px;background:transparent}
.sq{width:42px;height:42px;border-radius:13px;border:none;display:flex;align-items:center;justify-content:center}
.toggle{width:46px;height:28px;border-radius:14px;border:none;position:relative;flex:none}
.toggle i{position:absolute;top:3px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:left .2s}
textarea{width:100%;border-radius:14px;border:1.5px solid var(--line2);padding:10px 12px;font:inherit;font-size:14px;line-height:1.5;resize:none}
.teleprompter{background:#111428;color:#fff;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;min-height:420px;position:relative;overflow:hidden}
.tp-text{font-size:22px;line-height:1.5;font-weight:700}
.tp-text .done{color:#7C80A8}
.rec{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#E0436B;align-self:center}
.rec.on{border-radius:22px;width:64px;height:64px;margin:5px}
.post{aspect-ratio:4/5;border-radius:18px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:flex-end}
.prod{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:38%;aspect-ratio:1/1.6;border-radius:18px 18px 12px 12px;background:linear-gradient(160deg,#fff,#E9E4F5);box-shadow:0 18px 30px rgba(0,0,0,.18);display:flex;align-items:flex-end;justify-content:center;padding-bottom:16%;font-size:11px;font-weight:800;color:#7A6F96;letter-spacing:.04em}
.prod:before{content:"";position:absolute;top:-14%;left:28%;width:44%;height:16%;border-radius:8px 8px 2px 2px;background:#C9C2DE}
.cap{position:relative;padding:16px;color:#fff}
.cap b{display:block;font-size:22px;line-height:1.15;letter-spacing:-.02em}
.cap span{font-size:12px;font-weight:600;opacity:.9}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--bg)}
.seg button{min-height:40px;border:none;border-radius:11px;background:transparent;color:var(--mut);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button .n{width:20px;height:20px;border-radius:50%;background:var(--line2);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 3px rgba(45,226,208,.35)}.seg button.on .n{background:var(--pri)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg2 button{min-height:44px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);font-weight:700;font-size:14px;color:var(--ink)}
.seg2 button.on{border-color:var(--pri);background:var(--pri2);color:#7FF3E6}
.sb{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.5}.sb span{display:block;font-size:11.5px;font-weight:800;color:var(--pri);margin-bottom:2px}
.ntw{display:block;aspect-ratio:4/5;overflow:hidden;border-radius:12px}
.nt{aspect-ratio:4/5;border-radius:18px;padding:8%;display:flex;flex-direction:column;gap:.55em;font-size:15px;line-height:1.45;overflow:hidden}
.nt b{font-size:1.35em;line-height:1.2}
.nd{font-size:.75em;opacity:.6;margin-top:auto}
.n0{background:#fff;color:#1B1F3B;border:1px solid var(--line)}.n0 .nh{color:#D49B00;font-weight:800;font-size:.85em}
.n1{background:#FFE98A;color:#3B3000;font-family:'Patrick Hand',cursive;font-size:17px;transform:rotate(-1.2deg);box-shadow:0 8px 16px rgba(0,0,0,.12)}
.n2{background:#EAF1FF;justify-content:center}.n2 .q{align-self:flex-end;background:#2F6FE0;color:#fff;border-radius:16px 16px 4px 16px;padding:.6em .8em;font-weight:700}.n2 .a{background:#fff;color:#1B1F3B;border-radius:16px 16px 16px 4px;padding:.6em .8em}
.n3{background:#fff;color:#111;border:1px solid var(--line)}.n3 .av{width:2.2em;height:2.2em;border-radius:50%;background:#C2627A;color:#fff;font-weight:800;font-size:.8em;display:flex;align-items:center;justify-content:center;flex:none}
.n4{background:#1F3A2E;color:#F1F5EC;font-family:'Patrick Hand',cursive;font-size:17px}

.top h2,.disp,.big b,.h2d{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.01em}
.top h2{font-size:25px;font-weight:800}
.top{background:rgba(13,21,36,.94)!important}
.disp{font-size:44px;font-weight:800;line-height:.95}
.disp em{font-style:normal;color:var(--pri);text-shadow:0 0 18px rgba(45,226,208,.65)}
.btn{box-shadow:var(--glow);text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;font-size:20px;letter-spacing:.03em}
.pill.on,.seg2 button.on{box-shadow:0 0 14px rgba(45,226,208,.35)}
.seg2 button.on{color:var(--ink);background:var(--pri2)}
.card{border-color:var(--line);background:linear-gradient(180deg,#111B2D,#0C1423)!important}
.tab .plus{box-shadow:0 0 22px rgba(45,226,208,.65)}
.tabs{background:#0A111E!important}
.big b{font-size:22px;font-weight:800}
.hero{background:linear-gradient(135deg,#0FB9A8,#2459E0)!important;box-shadow:0 0 30px rgba(45,226,208,.4)}
.seg button .n{width:auto;height:auto;background:none!important;font-family:'Barlow Condensed';font-size:22px;font-weight:800;color:transparent;-webkit-text-stroke:1.2px var(--mut)}
.seg button.on .n{-webkit-text-stroke:1.2px var(--pri);text-shadow:0 0 12px rgba(45,226,208,.6)}
.seg button{font-family:'Barlow Condensed';text-transform:uppercase;font-size:17px}
.sb span{color:var(--pri)}
.side h1{font-family:'Barlow Condensed';text-transform:uppercase;font-size:44px;line-height:.95}
.side h1 em{font-style:normal;color:var(--pri);text-shadow:0 0 18px rgba(45,226,208,.6)}
textarea{background:#0A101C;color:var(--ink)}
.inp{background:var(--card)}

.sheetbg{position:absolute;inset:0;background:rgba(3,6,12,.7);z-index:8;display:flex;align-items:flex-end}
.sheet{background:var(--card);border-top:1px solid var(--line2);border-radius:24px 24px 0 0;padding:20px 18px 26px;width:100%;display:flex;flex-direction:column;gap:12px}
.istep{display:flex;gap:12px;align-items:center;font-size:15px;line-height:1.45}.istep b.k{width:30px;height:30px;border-radius:10px;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;flex:none;font-family:'Barlow Condensed';font-size:18px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:#10233A;border:1px solid var(--pri);box-shadow:var(--glow);color:#fff;border-radius:16px;padding:12px 14px;font-size:14px;font-weight:600;z-index:5}
</style>
</head>

<h1>AI Biz<br><em>app điện thoại</em></h1>
<p>Bản xem trước để bấm thử. Dữ liệu mẫu, chưa nối AI thật.</p>
<p>Bấm nút <b>+</b> để tạo bài theo 3 bước: AI soạn kịch bản, gợi ý đăng bài viết, ảnh hay video, rồi đăng ngay hoặc lên lịch.</p>
<p><a href="./">Xem các màn bản máy tính</a></p>
</div>
</div>

function startBuild(){var c=S.cr;clearInterval(timer);c.vstep=2;c.prog=0;c.when=false;S.credit-=4;render();timer=setInterval(function(){c.prog+=10;if(c.prog>=100){clearInterval(timer);c.vstep=3}render()},300)}
document.addEventListener('input',function(e){var k=e.target.getAttribute('data-in');if(k==='topic'){S.cr.topic=e.target.value;S.cr.ti=-1}if(k==='vnote')S.vid.note=e.target.value;if(k==='idea')S.im.idea=e.target.value});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='aiin'){document.querySelector('[data-a=send]').click()}});
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a'),v=b.getAttribute('data-v');
 if(a==='noop')return;
 if(a==='iclose'){if(e.target.closest('[data-a=noop]')&&b.getAttribute('data-a')!=='iclose')return;S.inst=false;return render()}
 if(a==='install'){if(window.__dp){window.__dp.prompt();window.__dp.userChoice.then(function(r){if(r.outcome==='accepted'){S.standalone=true;toast('Đã cài app AI Biz')}window.__dp=null});return}S.inst=true;return render()}
 if(a==='tab'){if(v==='new'){openCreate('script');return render()}return set({tab:v,view:null})}
 if(a==='back'){clearInterval(timer);return set({view:null})}
 if(a==='go'){if(v==='script'||v==='img'||v==='vid'){openCreate(v==='script'?'script':v,b.getAttribute('data-t')||'');if(b.getAttribute('data-t')){S.cr.ti=0}return render()}return set({view:v})}
 var c=S.cr;
 if(a==='ctab'){c.tab=v;c.when=false;return render()}
 if(a==='cti'){c.ti=+v;c.topic='';return render()}
 if(a==='cgoal'){c.goal=+v;return render()}
 if(a==='clen'){c.len=+v;return render()}
 if(a==='cwrite'||a==='cagain'){var t=TOPICS[c.ti>=0?c.ti:0],typed=(c.topic||'').trim();var k=a==='cagain'?Math.floor(Math.random()*TOPICS.length):-1;if(k>=0)t=TOPICS[k];c.sc={title:typed&&a==='cwrite'?typed.charAt(0).toUpperCase()+typed.slice(1):t.title,hook:t.hook,pts:t.pts.slice(),cta:t.cta,rec:t.rec,why:t.why,len:LENS[c.len]};S.credit-=1;return toast('AI đã soạn xong kịch bản')}
 if(a==='cnew'){c.sc=null;c.ti=-1;c.topic='';return render()}
 if(a==='cfmt'){var f=v.split(':');if(f[0]==='post'){c.tab='post'}else if(f[0]==='img'){c.tab='img';c.imode=f[1]||'note';c.istep=0}else{c.tab='vid';c.vmode=f[1]||'faceless';c.vstep=0}c.when=false;return render()}
 if(a==='cimode'){c.imode=v;c.istep=0;return render()}
 if(a==='cnote'){c.note=+v;return render()}
 if(a==='ccaro'){c.caro=v==='1';return render()}
 if(a==='cimake'){c.istep=1;c.when=false;S.credit-=1;return toast('Ảnh đã xong')}
 if(a==='cistep'){c.istep=0;return render()}
 if(a==='cvmode'){c.vmode=v;c.vstep=0;c.rec=false;clearInterval(timer);return render()}
 if(a==='iph'){S.im.photo=+v;return render()}
 if(a==='ist'){S.im.style=+v;return render()}
 if(a==='isz'){S.im.size=+v;return render()}
 if(a==='cfs'){c.fs=+v;return render()}
 if(a==='cvoice'){c.voice=+v;return render()}
 if(a==='crec'){if(!c.rec){c.rec=true;c.sec=0;timer=setInterval(function(){c.sec++;if(c.sec>=14){clearInterval(timer);c.rec=false;startBuild()}render()},1000)}else{clearInterval(timer);c.rec=false;return startBuild()}return render()}
 if(a==='cvbuild')return startBuild();
 if(a==='cvredo')return startBuild();
 if(a==='cvback'){c.vstep=0;return render()}
 if(a==='cwhen'){c.when=true;return render()}
 if(a==='cwi'){c.wi=+v;return render()}
 if(a==='cpub'){var p=v.split(':'),kind=p[1],title=c.sc?c.sc.title:(kind==='img'?'Ảnh mới':'Video mới');var col=kind==='img'?'#C2627A':kind==='vid'?'#2F6F86':'#2F6FE0',kk=kind==='img'?'Ảnh':kind==='vid'?'Video':'Bài';var times=['19:00','19:00','7:30','9:00'],days=['T5','T5','T6','T7'];S.sched.push({d:p[0]==='now'?'T5':days[c.wi],t:p[0]==='now'?'Ngay':times[c.wi],title:title,k:kk,c:col,st:'set'});S.view=null;S.tab='cal';S.day=p[0]==='now'?3:[3,3,4,5][c.wi];return toast(p[0]==='now'?'Đang đăng lên 6 kênh':'Đã lên lịch, tự đăng 6 kênh')}
 if(a==='an'){S.auto.n=+v;S.auto.ok=[];return render()}
 if(a==='arev'){S.auto.review=!S.auto.review;return render()}
 if(a==='aon'){S.auto.on=true;S.auto.ok=[];return toast('AI đã làm '+S.auto.n+' bài cho tuần này')}
 if(a==='aoff'){S.auto.on=false;return render()}
 if(a==='aok'){S.auto.ok.push(+v);return render()}
 if(a==='aall'){S.auto.ok=[0,1,2,3,4,5,6];return toast('Đã duyệt, các bài sẽ tự đăng đúng giờ')}
 if(a==='day'){S.day=+v;return render()}
 if(a==='sok'){S.sched[+v].st='set';return toast('Đã duyệt bài')}
 if(a==='ib'){S.inbox=v;return render()}
 if(a==='ar'){S.autoReply=!S.autoReply;return render()}
 if(a==='bo'){S.bouncer=!S.bouncer;return render()}
 if(a==='sc'){S.scope[+v][1]=!S.scope[+v][1];return render()}
 if(a==='cdone'){var c=S.cmts[+v];var wasHot=c.s==='hot';c.s='done';return toast(wasHot?'Đã mở tin nhắn với '+c.n:'Đã gửi trả lời')}
 if(a==='ask'){S.chat.push({w:'me',t:b.textContent},{w:'ai',t:ANS[+v]});return render()}
 if(a==='send'){var inp=document.getElementById('aiin'),q=(inp.value||'').trim();if(!q)return;S.chat.push({w:'me',t:esc(q)},{w:'ai',t:'Đây là bản xem trước nên em chỉ trả lời các câu bấm sẵn. Bản thật em sẽ làm theo yêu cầu của sếp.'});return render()}
 if(a==='idea'){S.ideas.unshift('Ý tưởng mới: cách chọn sữa rửa mặt cho da nhạy cảm');return toast('Vy đã ghi lại ý tưởng')}
});
S.standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__dp=e});
window.addEventListener('appinstalled',function(){S.standalone=true;render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
render();
})();
</script>
</body>
