body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F4F5FA;color:#1B1F3B}

<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B1F3B; background: #F4F5FA">
<nav aria-label="Điều hướng" style="flex: 0 0 240px; background: #FFFFFF; border-right: 1px solid #E6E8F0; padding: 22px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 20px"><span style="width: 40px; height: 40px; border-radius: 13px; background: #4F46E5; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">AB</span><span style="font-size: 19px; font-weight: 800; color: #1B1F3B; letter-spacing: -0.02em">AI Biz</span></div>
<a href="Main.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #3A3F5C; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #EEEDFD; color: #4F46E5"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg></span>Trợ lý AI</a>
<a href="Social.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #3A3F5C; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #FDE8EE; color: #E0436B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M21 16l-5-5-8 8"></path></svg></span>Phòng Media</a>
<a href="Schedule.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; background: #EEEDFD; color: #3730A3; font-weight: 700"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #E6EFFE; color: #2F6FE0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"></path><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"></path></svg></span>Phòng Marketing</a>
<a href="Web.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #3A3F5C; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #E0F5F1; color: #0F8F7F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path><path d="M9 8l-2 2 2 2M15 8l2 2-2 2"></path></svg></span>Phòng IT</a>
<a href="Care.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #3A3F5C; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #FDF1DC; color: #B86E00"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13v-1a8 8 0 0 1 16 0v1"></path><rect x="3" y="13" width="4" height="6" rx="1.5"></rect><rect x="17" y="13" width="4" height="6" rx="1.5"></rect><path d="M19 19a3 3 0 0 1-3 3h-3"></path></svg></span>Chăm sóc khách</a>
<div style="height: 1px; background: #E6E8F0; margin: 10px 8px"></div>
<a href="Plans.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #3A3F5C; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #ECEEF5; color: #1B1F3B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18"></path></svg></span>Gói và credit</a>
<a href="Onboarding.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #3A3F5C; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #ECEEF5; color: #1B1F3B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>Hồ sơ của tôi</a>
<div style="flex-grow: 1; min-height: 20px"></div>
<a href="Plans.html" style="display: flex; flex-direction: column; gap: 4px; border-radius: 18px; background: #1B1F3B; color: #FFFFFF; padding: 16px; font-size: 13px; line-height: 1.45"><span style="font-size: 15px; font-weight: 700">Bản miễn phí</span><span style="color: #C7CAE0">Nâng cấp để chat và chỉnh mọi thứ theo ý.</span></a>
</nav>
<main style="flex: 999 1 560px; min-width: 0; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 14px"><span style="width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex: none; background: #E6EFFE; color: #2F6FE0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"></path><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"></path></svg></span><h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em">Xu hướng và báo cáo</h1></div>
<p style="margin: 0; font-size: 15px; color: #5A5F7D">Phòng Marketing gợi ý đề tài đang lên và đọc số liệu giúp bạn. Số liệu là dữ liệu mẫu.</p>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="Schedule.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D9DCEA; color: #1B1F3B; font-size: 14px; font-weight: 500">Lịch đăng</a>
<a href="Marketing.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #4F46E5; border: 1px solid #4F46E5; color: #FFFFFF; font-size: 14px; font-weight: 600">Xu hướng và báo cáo</a>
</div>
<section style="background: #FFFFFF; border: 1px solid #E6E8F0; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Xu hướng tuần này trong ngành của bạn</h2>
<div style="font-size: 13px; color: #5A5F7D">Cập nhật thứ Hai hằng tuần</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{ trends }}" as="t" hint-placeholder-count="3">
<div style="padding: 16px; border-radius: 14px; background: #F4F5FA; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; font-weight: 700; color: #3730A3">{{ t.where }}</div>
<div style="font-size: 16px; font-weight: 700; line-height: 1.35">{{ t.title }}</div>
<div style="font-size: 14px; line-height: 1.45; color: #5A5F7D">{{ t.why }}</div>
<button type="button" onClick="{{ t.give }}" style="align-self: flex-start; min-height: 44px; padding: 0 14px; border-radius: 12px; border: {{ t.bd }}; background: {{ t.bg }}; color: {{ t.fg }}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{ t.btn }}</button>
</div>
</sc-for>
</div>
</section>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section style="flex: 1 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #E6E8F0; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">30 ngày qua</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4">
<div style="padding: 14px; border-radius: 14px; background: #F4F5FA; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 13px; color: #5A5F7D">{{ k.label }}</div>
<div style="font-size: 26px; font-weight: 700">{{ k.value }}</div>
<div style="font-size: 12px; font-weight: 600; color: #12584E">{{ k.delta }}</div>
</div>
</sc-for>
</div>
<div style="font-size: 13px; font-weight: 600; color: #5A5F7D">Khách để lại thông tin, theo kênh</div>
<sc-for list="{{ chans }}" as="c" hint-placeholder-count="3">
<div style="display: flex; gap: 10px; align-items: center; font-size: 14px">
<div style="flex: 0 0 110px">{{ c.name }}</div>
<div style="flex-grow: 1; height: 10px; border-radius: 5px; background: #ECEEF5"><div style="height: 10px; border-radius: 5px; background: #1B1F3B; width: {{ c.w }}"></div></div>
<div style="flex: 0 0 28px; text-align: right; font-weight: 600">{{ c.n }}</div>
</div>
</sc-for>
</section>
<section style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #E6E8F0; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Vy nhận xét</h2>
<sc-for list="{{ notes }}" as="n" hint-placeholder-count="3">
<div style="padding: 12px 14px; border-radius: 14px; background: #F4F5FA; font-size: 14px; line-height: 1.5">{{ n.text }}</div>
</sc-for>
<a href="Schedule.html" style="align-self: flex-start; display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #4F46E5; color: #FFFFFF; font-size: 14px; font-weight: 600">Áp dụng vào lịch tuần tới</a>
</section>
</div>
</main>
</div>
</template>
<a href="./" style="position:fixed;right:16px;bottom:16px;z-index:50;display:flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:#1B1F3B;color:#fff;font:600 13px 'Plus Jakarta Sans',system-ui,sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(27,31,59,.25)">Danh sách màn hình</a>
<script src="dc-runtime.js"></script>
<script>

class Component extends DCLogic {
constructor(props) { super(props); this.state = { given: [] }; }
renderVals() {
var self = this;
var trends = [
{ where: 'TikTok · Gợi ý mẫu', title: 'Thử thách 7 ngày cấp ẩm mùa thu', why: 'Video trước và sau theo ngày đang được xem nhiều. Hợp với khách da khô.' },
{ where: 'Facebook · Gợi ý mẫu', title: 'Hỏi đáp: kem chống nắng trong nhà', why: 'Nhiều bình luận hỏi có cần bôi khi ở trong tiệm cả ngày không.' },
{ where: 'Instagram · Gợi ý mẫu', title: 'Quy trình 3 bước cho người bận rộn', why: 'Carousel ngắn được lưu nhiều. Dễ làm từ mẫu có sẵn.' }
];
return {
trends: trends.map(function (t, i) { var on = self.state.given.indexOf(i) !== -1; return { where: t.where, title: t.title, why: t.why, btn: on ? 'Đã giao Phòng Media' : 'Giao Phòng Media làm', bg: on ? '#DDF1EC' : '#1B1F3B', fg: on ? '#12584E' : '#FFFFFF', bd: on ? '1px solid #DDF1EC' : '1px solid #1B1F3B', give: function () { if (!on) self.setState({ given: self.state.given.concat([i]) }); } }; }),
kpis: [
{ label: 'Lượt tiếp cận', value: '8.420', delta: 'Tăng 18% so với tháng trước' },
{ label: 'Tương tác', value: '612', delta: 'Tăng 9%' },
{ label: 'Khách để lại thông tin', value: '23', delta: 'Tăng 5 người' },
{ label: 'Bài tốt nhất', value: '3 bước', delta: '3 bước dưỡng da buổi tối' }
],
chans: [{ name: 'Facebook Page', n: 12, w: '100%' }, { name: 'Instagram', n: 7, w: '58%' }, { name: 'TikTok', n: 4, w: '33%' }],
notes: [
{ text: 'Bài dạng hỏi đáp có tương tác gấp đôi bài giới thiệu sản phẩm. Tuần tới nên có 2 bài hỏi đáp.' },
{ text: 'Khung 20:00 tối có nhiều người để lại thông tin nhất. Giữ giờ đăng này.' },
{ text: 'TikTok có lượt xem nhưng ít người vào trang đăng ký. Nên thêm câu mời cuối clip.' }
]
};
}
}

__dcStart(Component);
</script>
</body>
</html>
