<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Landing của Minh Anh</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#FFFFFF;color:#14213D}
a{color:#14213D}a:hover{color:#B0460F}
</style>

<style>body{background:#ECEEF5}#dc-root>div{margin:0 auto}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #14213D; display: flex; flex-direction: column">
<div style="background: #14213D; color: #FFFFFF; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 16px; align-items: center">
<div style="width: 72px; height: 72px; border-radius: 50%; background: #D5DCE8; color: #4A5568; display: flex; align-items: center; justify-content: center; font-size: 11px; text-align: center">Ảnh của bạn</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">Minh Anh</h1>
<div style="font-size: 14px; color: #D5DCE8">Tư vấn chăm sóc da tại nhà</div>
</div>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.55">Tôi giúp các chị chọn quy trình dưỡng da đơn giản, làm được mỗi ngày.</p>
</div>
<form style="padding: 20px 24px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Nhận tư vấn miễn phí</h2>
<label for="ld-name" style="font-size: 13px; color: #4A5568">Tên của bạn</label>
<input id="ld-name" type="text" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9D1DC; font-family: inherit; font-size: 15px; box-sizing: border-box">
<label for="ld-phone" style="font-size: 13px; color: #4A5568">Số điện thoại</label>
<input id="ld-phone" type="tel" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9D1DC; font-family: inherit; font-size: 15px; box-sizing: border-box">
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: #4A5568; min-height: 44px"><input type="checkbox" style="width: 20px; height: 20px">Tôi đồng ý để Minh Anh liên hệ theo thông tin trên.</label>
<button type="button" style="min-height: 48px; border-radius: 10px; border: none; background: #B0460F; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600">Gửi thông tin</button>
</form>
<div style="margin: 0 16px; border: 1px solid #DDE2EA; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: #F4F6F9">
<div style="font-size: 13px; font-weight: 600">Trợ lý AI của Minh Anh</div>
<div style="padding: 10px 12px; border-radius: 12px; background: #FFFFFF; font-size: 14px; line-height: 1.5">Chào chị, em là trợ lý AI của Minh Anh. Chị đang quan tâm chăm sóc da khô hay da dầu ạ?</div>
<div style="align-self: flex-end; padding: 10px 12px; border-radius: 12px; background: #14213D; color: #FFFFFF; font-size: 14px">Da khô, hay bong tróc</div>
<div style="padding: 10px 12px; border-radius: 12px; background: #FFFFFF; font-size: 14px; line-height: 1.5">Dạ. Chị để lại số điện thoại, Minh Anh sẽ gọi tư vấn kỹ hơn trong hôm nay.</div>
<div style="display: flex; gap: 8px">
<label for="ld-chat" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tin nhắn</label>
<input id="ld-chat" type="text" placeholder="Nhập tin nhắn" style="flex-grow: 1; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9D1DC; font-family: inherit; font-size: 14px; box-sizing: border-box">
<button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: none; background: #14213D; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600">Gửi</button>
</div>
</div>
<div style="flex-grow: 1"></div>
<div style="padding: 12px 24px; text-align: center; font-size: 12px; color: #4A5568; background: #E9EDF3">Tạo bằng AI Biz · bản miễn phí</div>
</div>
</template>
<a href="./" style="position:fixed;right:16px;bottom:16px;z-index:50;display:flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:#1B1F3B;color:#fff;font:600 13px 'Plus Jakarta Sans',system-ui,sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(27,31,59,.25)">Danh sách màn hình</a>
<script src="dc-runtime.js"></script>
<script>

class Component extends DCLogic {
renderVals() {
return {};
}
}

__dcStart(Component);
</script>
</body>
</html>
