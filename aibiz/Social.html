<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">

<title>AI Biz · Phòng Media</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Barlow+Condensed:wght@700;800&display=swap">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#070C16;color:#EEF4FA}
a{color:#EEF4FA;text-decoration:none}a:hover{color:#2DE2D0}
</style>

<style></style>
<style>h1{font-family:"Barlow Condensed",sans-serif!important;text-transform:uppercase;letter-spacing:.01em}body{background:#070C16}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #EEF4FA; background: #070C16">
<nav aria-label="Điều hướng" style="flex: 0 0 240px; background: #0F1727; border-right: 1px solid #1C2940; padding: 22px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 20px"><span style="width: 40px; height: 40px; border-radius: 13px; background: #2DE2D0; color: #04201D; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">AB</span><span style="font-size: 19px; font-weight: 800; color: #EEF4FA; letter-spacing: -0.02em">AI Biz</span></div>
<a href="Main.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #12302F; color: #2DE2D0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg></span>Trợ lý AI</a>
<a href="Social.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; background: #12302F; color: #7FF3E6; font-weight: 700"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #3A1A26; color: #FF7A9C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M21 16l-5-5-8 8"></path></svg></span>Phòng Media</a>
<a href="Schedule.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #16264A; color: #7FB0FF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"></path><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"></path></svg></span>Phòng Marketing</a>
<a href="Web.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #0F3330; color: #43E6CC"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path><path d="M9 8l-2 2 2 2M15 8l2 2-2 2"></path></svg></span>Phòng IT</a>
<a href="Care.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #3A2C12; color: #FFC453"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13v-1a8 8 0 0 1 16 0v1"></path><rect x="3" y="13" width="4" height="6" rx="1.5"></rect><rect x="17" y="13" width="4" height="6" rx="1.5"></rect><path d="M19 19a3 3 0 0 1-3 3h-3"></path></svg></span>Chăm sóc khách</a>
<div style="height: 1px; background: #1C2940; margin: 10px 8px"></div>
<a href="Plans.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #1A2638; color: #EEF4FA"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18"></path></svg></span>Gói và credit</a>
<a href="Onboarding.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #1A2638; color: #EEF4FA"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>Hồ sơ của tôi</a>
<div style="flex-grow: 1; min-height: 20px"></div>
<a href="Plans.html" style="display: flex; flex-direction: column; gap: 4px; border-radius: 18px; background: #16223A; color: #FFFFFF; padding: 16px; font-size: 13px; line-height: 1.45"><span style="font-size: 15px; font-weight: 700">Bản miễn phí</span><span style="color: #8FA3BF">Nâng cấp để chat và chỉnh mọi thứ theo ý.</span></a>
</nav>
<main style="flex: 999 1 560px; min-width: 0; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 14px"><span style="width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex: none; background: #3A1A26; color: #FF7A9C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M21 16l-5-5-8 8"></path></svg></span><h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em">Phòng Media</h1></div>
<p style="margin: 0; font-size: 15px; color: #8FA3BF">Chọn phong cách và loại nội dung, xem trước, rồi đăng.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="Social.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #2DE2D0; border: 1px solid #2DE2D0; color: #04201D; font-size: 14px; font-weight: 600">Bài viết</a>
<a href="Photo.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #0F1727; border: 1px solid #2B3B57; color: #EEF4FA; font-size: 14px; font-weight: 500">Công cụ ảnh</a>
<a href="Video.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #0F1727; border: 1px solid #2B3B57; color: #EEF4FA; font-size: 14px; font-weight: 500">Tạo video</a>
<a href="Voice.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #0F1727; border: 1px solid #2B3B57; color: #EEF4FA; font-size: 14px; font-weight: 500">Giọng đọc</a>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="background: #0F1727; border: 1px solid #1C2940; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">1. Phong cách</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ styles }}" as="s" hint-placeholder-count="6">
<button type="button" onClick="{{ s.pick }}" aria-pressed="{{ s.on }}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; background: {{ s.bg }}; color: {{ s.fg }}; border: 1px solid {{ s.bd }}">{{ s.label }}</button>
</sc-for>
</div>
</div>
<div style="background: #0F1727; border: 1px solid #1C2940; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">2. Nội dung</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ topics }}" as="t" hint-placeholder-count="6">
<button type="button" onClick="{{ t.pick }}" aria-pressed="{{ t.on }}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; background: {{ t.bg }}; color: {{ t.fg }}; border: 1px solid {{ t.bd }}">{{ t.label }}</button>
</sc-for>
</div>
</div>
<div style="background: #0F1727; border: 1px solid #1C2940; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">3. Đăng</h2>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 12px; border: none; background: #2DE2D0; color: #04201D; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Chia sẻ một chạm</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #2B3B57; background: #0F1727; color: #EEF4FA; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Tải về</button>
<button type="button" onClick="{{ askSchedule }}" style="min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #2B3B57; background: #0F1727; color: #EEF4FA; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Hẹn giờ tự đăng</button>
</div>
<sc-if value="{{ locked }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 14px; background: #12302F; font-size: 14px">
<div>Hẹn giờ tự đăng chỉ có ở gói cao nhất.</div>
<a href="Schedule.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #2B3B57; font-weight: 600">Xem lịch đăng</a>
<a href="Plans.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #2B3B57; font-weight: 600">Xem gói</a>
</div>
</sc-if>
</div>
</section>
<section style="flex: 1 1 360px; min-width: 0; background: #0F1727; border: 1px solid #1C2940; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">Xem trước</h2>
<div style="font-size: 13px; color: #8FA3BF">{{ kind }}</div>
</div>
<div style="aspect-ratio: 4 / 5; max-height: 460px; border-radius: 14px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; background: {{ pv.bg }}; color: {{ pv.fg }}; border: {{ pv.bd }}">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase">{{ pv.tag }}</div>
<div style="font-size: 34px; font-weight: 700; line-height: 1.2">{{ headline }}</div>
<div style="font-size: 14px; font-weight: 500">Minh Anh · Tư vấn chăm sóc da</div>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.6">{{ caption }}</p>
<div style="font-size: 14px; color: #8FA3BF">#chamsocda #minhanh</div>
</section>
</div>
</main>
</div>
</template>
<a href="./" style="position:fixed;right:16px;bottom:16px;z-index:50;display:flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background: #16223A;color:#fff;font:600 13px 'Be Vietnam Pro',system-ui,sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(27,31,59,.25)">Danh sách màn hình</a>
<script src="dc-runtime.js"></script>
<script>

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { style: 0, topic: 0, locked: false };
}
renderVals() {
var self = this;
var styles = [
{ label: 'Chữ trên nền màu', kind: 'Ảnh 4:5, dựng theo mẫu', bg: '#16223A', fg: '#FFFFFF', bd: 'none', tag: 'Mẫu chữ' },
{ label: 'Ảnh thật ghép chữ', kind: 'Ảnh 4:5, dùng ảnh bạn tải lên', bg: '#6B5646', fg: '#FFFFFF', bd: 'none', tag: 'Ảnh của bạn' },
{ label: 'Vẽ tay sketch', kind: 'Ảnh 4:5, dựng theo mẫu', bg: '#FBF7EC', fg: '#EEF4FA', bd: '2px dashed #EEF4FA', tag: 'Sketch' },
{ label: 'Carousel', kind: 'Bộ 5 ảnh, dựng theo mẫu', bg: '#2DE2D0', fg: '#04201D', bd: 'none', tag: 'Trang 1 trên 5' },
{ label: 'B-roll ghép chữ', kind: 'Video 30 giây, dựng theo mẫu', bg: '#2F3E46', fg: '#FFFFFF', bd: 'none', tag: 'Video theo mẫu' },
{ label: 'Video AI', kind: 'Video AI, chỉ có ở bản trả phí', bg: '#3B2F4A', fg: '#FFFFFF', bd: 'none', tag: 'Bản trả phí' }
];
var topics = [
{ label: 'Kiến thức ngành', headline: '3 bước dưỡng da buổi tối', caption: 'Da khô mùa lạnh thường do bỏ qua bước cấp ẩm trước khi ngủ. Ba bước đơn giản em vẫn làm mỗi tối, mất chưa tới năm phút.' },
{ label: 'Câu chuyện cá nhân', headline: 'Vì sao tôi bắt đầu', caption: 'Hai năm trước em còn làm văn phòng và chưa từng nghĩ mình sẽ đi tư vấn chăm sóc da. Mọi thứ bắt đầu từ làn da khô của chính em.' },
{ label: 'Giới thiệu sản phẩm', headline: '[Tên sản phẩm]', caption: '[Mô tả sản phẩm lấy từ kho kiến thức đã duyệt của ngành]' },
{ label: 'Cảm nhận khách hàng', headline: 'Khách nói gì', caption: '[Cảm nhận thật của khách, đăng khi khách đồng ý]' },
{ label: 'Lời mời hợp tác', headline: 'Cùng làm với tôi', caption: 'Em đang tìm hai bạn muốn làm thêm buổi tối cùng nhóm. Em không hứa thu nhập, chỉ hứa hướng dẫn kỹ từng bước.' },
{ label: 'Hỏi đáp', headline: 'Da dầu có cần dưỡng ẩm?', caption: 'Câu em được hỏi nhiều nhất tuần này. Có, và đây là cách chọn loại dưỡng ẩm không gây bí da.' }
];
function chip(on) { return on ? { bg: '#2DE2D0', fg: '#04201D', bd: '#2DE2D0' } : { bg: '#0F1727', fg: '#EEF4FA', bd: '#2B3B57' }; }
var s = styles[this.state.style], t = topics[this.state.topic];
return {
styles: styles.map(function (x, i) { var c = chip(i === self.state.style); return { label: x.label, on: i === self.state.style, bg: c.bg, fg: c.fg, bd: c.bd, pick: function () { self.setState({ style: i }); } }; }),
topics: topics.map(function (x, i) { var c = chip(i === self.state.topic); return { label: x.label, on: i === self.state.topic, bg: c.bg, fg: c.fg, bd: c.bd, pick: function () { self.setState({ topic: i }); } }; }),
pv: { bg: s.bg, fg: s.fg, bd: s.bd, tag: s.tag },
kind: s.kind,
headline: t.headline,
caption: t.caption,
locked: this.state.locked,
askSchedule: function () { self.setState({ locked: true }); }
};
}
}

__dcStart(Component);
</script>
</body>
</html>
