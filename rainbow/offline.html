<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vương Quốc Cầu Vồng</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #37373e; color: #fffaf2;
        font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      h1 { font-size: 1.6rem; margin: 0 0 12px; }
      p { font-size: 1.1rem; line-height: 1.5; margin: 0 0 20px; }
      button { font: inherit; font-weight: 700; padding: 12px 28px; border-radius: 14px; border: 0; background: #ffd23f; color: #4a2a57; }
    </style>
  </head>
  <body>
    <div>
      <h1>Vương Quốc Cầu Vồng</h1>
      <p>Lần mở đầu tiên cần có mạng để tải game.<br />Bật Wi-Fi rồi bấm thử lại nhé.</p>
      <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">Thử lại</button>
    </div>
  </body>
</html>
