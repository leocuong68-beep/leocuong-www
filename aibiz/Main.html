<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<meta name="robots" content="noindex">
<title>AI Biz · Trợ lý AI</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Barlow+Condensed:wght@700;800&display=swap">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#070C16;color:#EEF4FA}
a{color:#EEF4FA;text-decoration:none}a:hover{color:#2DE2D0}
</style>

<style></style>
<style>h1{font-family:"Barlow Condensed",sans-serif!important;text-transform:uppercase;letter-spacing:.01em}body{background:#070C16}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="display: flex; min-height: 100vh; background: #070C16; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #EEF4FA">
<nav aria-label="Điều hướng" style="flex: 0 0 240px; background: #0F1727; border-right: 1px solid #1C2940; padding: 22px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 20px"><span style="width: 40px; height: 40px; border-radius: 13px; background: #2DE2D0; color: #04201D; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">AB</span><span style="font-size: 19px; font-weight: 800; color: #EEF4FA; letter-spacing: -0.02em">AI Biz</span></div>
<a href="Main.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; background: #12302F; color: #7FF3E6; font-weight: 700"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #12302F; color: #2DE2D0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg></span>Trợ lý AI</a>
<a href="Social.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #3A1A26; color: #FF7A9C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M21 16l-5-5-8 8"></path></svg></span>Phòng Media</a>
<a href="Schedule.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #16264A; color: #7FB0FF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"></path><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"></path></svg></span>Phòng Marketing</a>
<a href="Web.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #0F3330; color: #43E6CC"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path><path d="M9 8l-2 2 2 2M15 8l2 2-2 2"></path></svg></span>Phòng IT</a>
<a href="Care.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #3A2C12; color: #FFC453"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13v-1a8 8 0 0 1 16 0v1"></path><rect x="3" y="13" width="4" height="6" rx="1.5"></rect><rect x="17" y="13" width="4" height="6" rx="1.5"></rect><path d="M19 19a3 3 0 0 1-3 3h-3"></path></svg></span>Chăm sóc khách</a>
<div style="height: 1px; background: #1C2940; margin: 10px 8px"></div>
<a href="Plans.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #1A2638; color: #EEF4FA"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18"></path></svg></span>Gói và credit</a>
<a href="Onboarding.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 14px; font-size: 15px; color: #B7C4D8; font-weight: 500"><span style="width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: #1A2638; color: #EEF4FA"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>Hồ sơ của tôi</a>
<div style="flex-grow: 1; min-height: 20px"></div>
<a href="Plans.html" style="display: flex; flex-direction: column; gap: 4px; border-radius: 18px; background: #16223A; color: #FFFFFF; padding: 16px; font-size: 13px; line-height: 1.45"><span style="font-size: 15px; font-weight: 700">Bản miễn phí</span><span style="color: #8FA3BF">Nâng cấp để chat và chỉnh mọi thứ theo ý.</span></a>
</nav>
<main style="flex: 1 1 auto; min-width: 0; padding: 26px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center">
<div style="font-size: 15px; font-weight: 600; color: #8FA3BF">Trợ lý AI</div>
<div style="padding: 8px 14px; border-radius: 999px; background: #0F1727; border: 1px solid #1C2940; font-size: 13px; font-weight: 600">Bản miễn phí, còn {{ left }} lượt chat</div>
</div>
<div style="display: flex; gap: 18px; align-items: center">
<span style="width: 64px; height: 64px; border-radius: 22px; background: #2DE2D0; color: #04201D; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; flex: none">V</span>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Chào sếp Minh Anh</h1>
<p style="margin: 0; font-size: 16px; color: #8FA3BF">Hôm nay có 3 việc cần sếp: duyệt 2 ảnh, gọi lại chị Hương, xem lịch tuần tới.</p>
</div>
</div>
<section style="flex: 1 1 auto; background: #0F1727; border-radius: 24px; border: 1px solid #1C2940; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-height: 360px">
<sc-for list="{{ messages }}" as="m" hint-placeholder-count="2">
<sc-if value="{{ m.isText }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; justify-content: {{ m.side }}">
<div style="max-width: 80%; padding: 12px 16px; border-radius: {{ m.radius }}; font-size: 15px; line-height: 1.55; background: {{ m.bg }}; color: {{ m.fg }}">{{ m.text }}</div>
</div>
</sc-if>
<sc-if value="{{ m.isTask }}" hint-placeholder-val="{{ false }}">
<a href="{{ m.href }}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-left: 20px; min-height: 44px; padding: 10px 14px; border-radius: 14px; border: 1px solid #1C2940; font-size: 14px">
<span style="font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: {{ m.tagBg }}; color: {{ m.tagFg }}">{{ m.dept }}</span>
<span style="flex: 1 1 200px">{{ m.text }}</span>
<span style="font-size: 12px; font-weight: 700; color: #8FA3BF">{{ m.status }}</span>
</a>
</sc-if>
</sc-for>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{ quick }}" as="q" hint-placeholder-count="4">
<button type="button" onClick="{{ q.run }}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: none; background: #070C16; color: #EEF4FA; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{ q.label }}</button>
</sc-for>
</div>
<div style="display: flex; gap: 10px; align-items: center; background: #0F1727; border: 1.5px solid #2B3B57; border-radius: 18px; padding: 6px 6px 6px 16px">
<label for="ai-in" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tin nhắn cho Vy</label>
<input id="ai-in" type="text" value="{{ draft }}" onChange="{{ onType }}" placeholder="Giao việc cho Vy" style="flex: 1 1 auto; min-width: 0; min-height: 44px; border: none; outline: none; font-family: inherit; font-size: 15px; background: transparent">
<button type="button" onClick="{{ send }}" aria-label="Gửi" style="width: 46px; height: 46px; border-radius: 14px; border: none; background: #2DE2D0; color: #04201D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</section>
</main>
<aside style="flex: 0 0 340px; padding: 26px 24px 26px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0 0 2px; font-size: 18px; font-weight: 800">Team của sếp</h2>
<div style="background: #0F1727; border-radius: 20px; border: 1px solid #1C2940; padding: 16px; display: flex; gap: 14px; align-items: flex-start"><span style="width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex: none; background: #3A1A26; color: #FF7A9C"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M21 16l-5-5-8 8"></path></svg></span><div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-start"><span style="font-size: 15px; font-weight: 700">Phòng Media</span><span style="font-size: 13.5px; line-height: 1.45; color: #8FA3BF">2 ảnh và 1 clip chờ sếp duyệt</span><a href="Social.html" style="margin-top: 6px; display: flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 700; background: #3A1A26; color: #FF7A9C">Duyệt</a></div></div>
<div style="background: #0F1727; border-radius: 20px; border: 1px solid #1C2940; padding: 16px; display: flex; gap: 14px; align-items: flex-start"><span style="width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex: none; background: #16264A; color: #7FB0FF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"></path><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"></path></svg></span><div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-start"><span style="font-size: 15px; font-weight: 700">Phòng Marketing</span><span style="font-size: 13.5px; line-height: 1.45; color: #8FA3BF">3 bài đã hẹn giờ tuần này, 2 xu hướng mới</span><a href="Marketing.html" style="margin-top: 6px; display: flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 700; background: #16264A; color: #7FB0FF">Xem lịch</a></div></div>
<div style="background: #0F1727; border-radius: 20px; border: 1px solid #1C2940; padding: 16px; display: flex; gap: 14px; align-items: flex-start"><span style="width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex: none; background: #0F3330; color: #43E6CC"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path><path d="M9 8l-2 2 2 2M15 8l2 2-2 2"></path></svg></span><div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-start"><span style="font-size: 15px; font-weight: 700">Phòng IT</span><span style="font-size: 13.5px; line-height: 1.45; color: #8FA3BF">Trang đăng ký có 132 lượt xem, 4 người để lại thông tin</span><a href="Funnel.html" style="margin-top: 6px; display: flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 700; background: #0F3330; color: #43E6CC">Mở trang</a></div></div>
<div style="background: #0F1727; border-radius: 20px; border: 1px solid #1C2940; padding: 16px; display: flex; gap: 14px; align-items: flex-start"><span style="width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex: none; background: #3A2C12; color: #FFC453"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13v-1a8 8 0 0 1 16 0v1"></path><rect x="3" y="13" width="4" height="6" rx="1.5"></rect><rect x="17" y="13" width="4" height="6" rx="1.5"></rect><path d="M19 19a3 3 0 0 1-3 3h-3"></path></svg></span><div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-start"><span style="font-size: 15px; font-weight: 700">Chăm sóc khách</span><span style="font-size: 13.5px; line-height: 1.45; color: #8FA3BF">5 bình luận chờ trả lời, 3 khách cần liên hệ</span><a href="Care.html" style="margin-top: 6px; display: flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 700; background: #3A2C12; color: #FFC453">Trả lời</a></div></div>
</aside>
</div>
</template>
<a href="./" style="position:fixed;right:16px;bottom:16px;z-index:50;display:flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background: #16223A;color:#fff;font:600 13px 'Be Vietnam Pro',system-ui,sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(27,31,59,.25)">Danh sách màn hình</a>
<script src="dc-runtime.js"></script>
<script>

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { used: 7, draft: '', messages: [{ who: 'bot', text: 'Em đã nắm hồ sơ của sếp: tư vấn mỹ phẩm Hàn Quốc, khách chính là phụ nữ 30 đến 50 tuổi, xưng em gọi chị. Sếp cần gì cứ giao em nhé.' }] };
}
ask(q, reply) {
var add = [{ who: 'me', text: q }, { who: 'bot', text: reply.text }].concat((reply.tasks || []).map(function (t) { return { who: 'task', dept: t[0], text: t[1], status: t[2], href: t[3] }; }));
this.setState({ messages: this.state.messages.concat(add).slice(-8), used: Math.min(20, this.state.used + 1), draft: '' });
}
renderVals() {
var self = this;
var tag = { 'Marketing': ['#16264A', '#7FB0FF'], 'Media': ['#3A1A26', '#FF7A9C'], 'IT': ['#0F3330', '#43E6CC'], 'Chăm sóc khách': ['#3A2C12', '#FFC453'] };
var script = [
['Lên kế hoạch nội dung tuần tới', { text: 'Dạ, em đã chia việc cho các phòng. Sếp duyệt lịch trước tối Chủ nhật nhé.', tasks: [
['Marketing', 'Lịch 5 bài tuần 12/10, có 2 bài theo xu hướng', 'Đang soạn', 'Schedule.dc.html'],
['Media', '3 ảnh và 2 clip 30 giây theo mẫu', 'Chờ lịch duyệt', 'Social.dc.html'],
['Chăm sóc khách', 'Trả lời bình luận kèm link trang đăng ký', 'Đang bật', 'Care.dc.html']] }],
['Làm video sản phẩm mới', { text: 'Sếp gửi em tên sản phẩm và một hai ảnh thật. Em giao việc như sau:', tasks: [
['Media', 'Clip 30 giây mẫu So sánh A và B, phụ đề chạy chữ', 'Chờ ảnh', 'Video.dc.html'],
['IT', 'Thêm sản phẩm vào phễu Giới thiệu sản phẩm', 'Chờ duyệt', 'Funnel.dc.html']] }],
['Ai cần chăm sóc hôm nay?', { text: 'Ba người ạ: chị Hương để lại số hôm qua, anh Tuấn hẹn gọi lại hôm nay, chị Lan mua được 30 ngày. Em soạn sẵn tin nhắn rồi.', tasks: [
['Chăm sóc khách', '3 tin nhắn soạn sẵn, sếp xem và gửi', 'Chờ sếp gửi', 'Care.dc.html']] }],
['Khách chê giá thì nói sao?', { text: 'Sếp đừng giảm giá ngay. Hỏi khách đang so với sản phẩm nào, nói rõ khác nhau ở thành phần và cách dùng, rồi gợi ý bắt đầu bằng món nhỏ nhất để thử.' }]
];
return {
left: 20 - this.state.used,
draft: this.state.draft,
quick: script.map(function (s) { return { label: s[0], run: function () { self.ask(s[0], s[1]); } }; }),
messages: this.state.messages.map(function (m) {
var me = m.who === 'me', t = tag[m.dept] || ['#12302F', '#2DE2D0'];
return { isText: m.who !== 'task', isTask: m.who === 'task', text: m.text, dept: m.dept || '', status: m.status || '', href: m.href || 'Main.dc.html', tagBg: t[0], tagFg: t[1],
side: me ? 'flex-end' : 'flex-start', bg: me ? '#2DE2D0' : '#070C16', fg: me ? '#0F1727' : '#EEF4FA', radius: me ? '18px 18px 6px 18px' : '18px 18px 18px 6px' };
}),
onType: function (e) { self.setState({ draft: e.target.value }); },
send: function () { var q = (self.state.draft || '').trim(); if (!q) return; self.ask(q, { text: 'Đây là bản prototype nên em chỉ trả lời được bốn câu bấm sẵn phía trên ô nhập.' }); }
};
}
}

__dcStart(Component);
</script>
</body>
</html>
