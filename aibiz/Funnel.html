<p style="margin: 0; font-size: 15px; color: #5A5F7D">Mỗi trang chỉ có một việc cho khách làm, rồi dẫn sang bước kế tiếp. Chọn mục tiêu, trợ lý dựng cả chuỗi.</p>

<sc-for list="{{ goals }}" as="g" hint-placeholder-count="4">
<button type="button" onClick="{{ g.pick }}" aria-pressed="{{ g.on }}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; background: {{ g.bg }}; color: {{ g.fg }}; border: 1px solid {{ g.bd }}">{{ g.label }}</button>
</sc-for>
</div>
</section>
<section style="background: #FFFFFF; border: 1px solid #E6E8F0; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">2. Các bước trong phễu</h2>
<div style="font-size: 13px; color: #5A5F7D">Số liệu mẫu, 30 ngày gần nhất</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">

<span style="font-size: 12px; font-weight: 700; color: #3730A3">Bước {{ s.n }}</span>
<span style="font-size: 15px; font-weight: 600">{{ s.name }}</span>
<span style="font-size: 13px; line-height: 1.4; color: #5A5F7D">{{ s.job }}</span>
<span style="font-size: 22px; font-weight: 700">{{ s.count }}</span>
<span style="font-size: 12px; color: #5A5F7D">{{ s.rate }}</span>
</button>
</sc-for>
</div>
<div style="font-size: 14px; line-height: 1.5; color: #5A5F7D">{{ leak }}</div>
</section>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<div style="font-size: 26px; font-weight: 700; line-height: 1.25">{{ pv.headline }}</div>
<div style="font-size: 15px; line-height: 1.5; color: #C7CAE0">{{ pv.sub }}</div>
<div style="align-self: flex-start; display: flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 12px; background: #4F46E5; color: #FFFFFF; font-size: 15px; font-weight: 600">{{ pv.cta }}</div>
</div>
<div style="font-size: 13px; color: #5A5F7D">Trang không có menu và không có link ra ngoài, chỉ một nút duy nhất.</div>
</section>

<div style="flex: 0 0 64px; font-size: 13px; font-weight: 700; color: #3730A3">{{ m.day }}</div>

<div style="padding: 12px 16px; border-radius: 14px; background: #DDF1EC; color: #12584E; font-size: 14px; font-weight: 600">Phễu đang chạy. Link chia sẻ: minhanh.[tên miền]/{{ firstSlug }}</div>
