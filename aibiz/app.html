<title>AI Biz · App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#1B1F3B;--mut:#5A5F7D;--line:#E6E8F0;--bg:#F4F5FA;--pri:#4F46E5;--pri2:#EEEDFD;--pink:#E0436B;--pinkS:#FDE8EE;--blue:#2F6FE0;--blueS:#E6EFFE;--teal:#0F8F7F;--tealS:#E0F5F1;--amb:#B86E00;--ambS:#FDF1DC;--ok:#12584E;--okS:#DDF1EC}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:#DCDFEC}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #A5A1F5;outline-offset:2px}
.stage{min-height:100%;display:flex;align-items:flex-start;justify-content:center;gap:48px;padding:28px 16px}
.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;box-shadow:0 0 0 10px #1B1F3B,0 30px 60px rgba(27,31,59,.35);overflow:hidden;position:relative;display:flex;flex-direction:column}
.side{max-width:340px;padding-top:40px}
.side h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 12px}
.side p{color:var(--mut);line-height:1.6;margin:0 0 12px}
.side a{color:var(--pri);font-weight:700}
@media (max-width:820px){.stage{padding:0;display:block}.side{display:none}.phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
.top{padding:14px 18px 10px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:60px}
.top .back{width:40px;height:40px;border-radius:12px;border:none;background:var(--bg);display:flex;align-items:center;justify-content:center}
.top h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1}
.chipc{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--pri2);color:#3730A3}
.scroll{flex:1;overflow-y:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom))}
.tab{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mut);min-height:52px;justify-content:center}
.tab.on{color:var(--pri);font-weight:800}
.tab .plus{width:46px;height:46px;border-radius:16px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-6px;box-shadow:0 6px 14px rgba(79,70,229,.35)}
.scroll>*{flex-shrink:0}
.post .prod{font-size:clamp(7px,2.4vw,11px)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.h{font-size:15px;font-weight:800;margin:0}
.sub{font-size:13px;color:var(--mut);line-height:1.5;margin:0}
.btn{min-height:50px;border-radius:16px;border:none;background:var(--pri);color:#fff;font-size:16px;font-weight:800;width:100%}
.btn2{min-height:44px;border-radius:14px;border:1.5px solid #D9DCEA;background:#fff;color:var(--ink);font-size:14px;font-weight:700;padding:0 14px}
.row{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid #D9DCEA;background:#fff;font-size:13.5px;font-weight:600;color:var(--ink)}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tag{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.ico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.big{border:none;text-align:left;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.big b{font-size:17px}
.big span{font-size:13px;line-height:1.45;color:#3A3F5C}
.thumb{border-radius:12px;flex:none;display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:10px;font-weight:700}
.prog{height:8px;border-radius:4px;background:#ECEEF5;overflow:hidden}.prog i{display:block;height:100%;background:var(--pri);border-radius:4px;transition:width .4s}
.step{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.dot{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.chat{display:flex;flex-direction:column;gap:8px}
.me{align-self:flex-end;background:var(--pri);color:#fff;padding:10px 14px;border-radius:18px 18px 6px 18px;font-size:14.5px;max-width:85%}
.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:18px 18px 18px 6px;font-size:14.5px;line-height:1.5;max-width:88%}
.inp{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid #D9DCEA;border-radius:16px;padding:5px 5px 5px 14px}
.inp input{flex:1;border:none;outline:none;font:inherit;font-size:15px;min-height:42px;background:transparent}
.sq{width:42px;height:42px;border-radius:13px;border:none;display:flex;align-items:center;justify-content:center}
.toggle{width:46px;height:28px;border-radius:14px;border:none;position:relative;flex:none}
.toggle i{position:absolute;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
textarea{width:100%;border-radius:14px;border:1.5px solid #D9DCEA;padding:10px 12px;font:inherit;font-size:14px;line-height:1.5;resize:none}
.teleprompter{background:#111428;color:#fff;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;min-height:420px;position:relative;overflow:hidden}
.tp-text{font-size:22px;line-height:1.5;font-weight:700}
.tp-text .done{color:#7C80A8}
.rec{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#E0436B;align-self:center}
.rec.on{border-radius:22px;width:64px;height:64px;margin:5px}
.post{aspect-ratio:4/5;border-radius:18px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:flex-end}
.prod{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:38%;aspect-ratio:1/1.6;border-radius:18px 18px 12px 12px;background:linear-gradient(160deg,#fff,#E9E4F5);box-shadow:0 18px 30px rgba(0,0,0,.18);display:flex;align-items:flex-end;justify-content:center;padding-bottom:16%;font-size:11px;font-weight:800;color:#7A6F96;letter-spacing:.04em}
.prod:before{content:"";position:absolute;top:-14%;left:28%;width:44%;height:16%;border-radius:8px 8px 2px 2px;background:#C9C2DE}
.cap{position:relative;padding:16px;color:#fff}
.cap b{display:block;font-size:22px;line-height:1.15;letter-spacing:-.02em}
.cap span{font-size:12px;font-weight:600;opacity:.9}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;font-size:14px;font-weight:600;z-index:5}
</style>
</head>
<body>
<div class="stage">
<div class="phone" id="app" aria-live="polite"></div>
<div class="side">
<h1>AI Biz, bản app điện thoại</h1>
<p>Bản xem trước để bấm thử. Dữ liệu mẫu, chưa nối AI thật.</p>
<p>Bấm nút <b>+</b> ở giữa thanh dưới để thử ba cách tạo bài: quay 1 ý cho AI dựng video, tạo ảnh social từ ảnh của bạn, hoặc để AI tự làm cả tuần.</p>
<p><a href="./">Xem các màn bản máy tính</a></p>
</div>
</div>

 render._v=v||S.tab;
}
var timer=null;
document.addEventListener('input',function(e){var k=e.target.getAttribute('data-in');if(k==='vnote')S.vid.note=e.target.value;if(k==='idea')S.im.idea=e.target.value});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='aiin'){document.querySelector('[data-a=send]').click()}});
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a'),v=b.getAttribute('data-v');
 if(a==='tab'){if(v==='new')return set({view:'new'});return set({tab:v,view:null})}
 if(a==='back'){clearInterval(timer);return set({view:null})}
 if(a==='go'){if(v==='vid')S.vid={step:0,sel:1,note:'',rec:false,sec:0,prog:0};if(v==='img')S.im.step=0;return set({view:v})}
 if(a==='rec'){var r=S.vid;if(!r.rec){r.rec=true;r.sec=0;timer=setInterval(function(){r.sec++;if(r.sec>=12){clearInterval(timer);r.rec=false;r.step=1;r.sel=0}render()},1000)}else{clearInterval(timer);r.rec=false;r.step=1;r.sel=0}return render()}
 if(a==='vstep'){S.vid.step=+v;return render()}
 if(a==='vsel'){S.vid.sel=+v;return render()}
 if(a==='vbuild'){S.vid.step=2;S.vid.prog=0;S.credit-=4;render();timer=setInterval(function(){S.vid.prog+=10;if(S.vid.prog>=100){clearInterval(timer);S.vid.step=3}render()},350);return}
 if(a==='iph'){S.im.photo=+v;return render()}
 if(a==='ist'){S.im.style=+v;return render()}
 if(a==='isz'){S.im.size=+v;return render()}
 if(a==='imake'){S.im.step=1;S.im.pick=0;S.credit-=1;return toast('Đã tạo 3 bản ảnh')}
 if(a==='ipick'){S.im.pick=+v;return render()}
 if(a==='istep'){S.im.step=+v;return render()}
 if(a==='publish'){var title=S.view==='img'?'Ảnh '+STYLES[S.im.style].n.toLowerCase():'Video: 3 lỗi khiến da khô';S.sched.push({d:'T5',t:v==='now'?'Ngay':'19:00',title:title,k:S.view==='img'?'Ảnh':'Video',c:S.view==='img'?'#C2627A':'#2F6F86',st:'set'});S.view=null;S.tab='cal';S.day=3;return toast(v==='now'?'Đang đăng lên 6 kênh':'Đã hẹn 19:00 thứ Năm, tự đăng 6 kênh')}
 if(a==='an'){S.auto.n=+v;S.auto.ok=[];return render()}
 if(a==='arev'){S.auto.review=!S.auto.review;return render()}
 if(a==='aon'){S.auto.on=true;S.auto.ok=[];return toast('AI đã làm '+S.auto.n+' bài cho tuần này')}
 if(a==='aoff'){S.auto.on=false;return render()}
 if(a==='aok'){S.auto.ok.push(+v);return render()}
 if(a==='aall'){S.auto.ok=[0,1,2,3,4,5,6];return toast('Đã duyệt, các bài sẽ tự đăng đúng giờ')}
 if(a==='day'){S.day=+v;return render()}
 if(a==='sok'){S.sched[+v].st='set';return toast('Đã duyệt bài')}
 if(a==='ib'){S.inbox=v;return render()}
 if(a==='ar'){S.autoReply=!S.autoReply;return render()}
 if(a==='bo'){S.bouncer=!S.bouncer;return render()}
 if(a==='sc'){S.scope[+v][1]=!S.scope[+v][1];return render()}
 if(a==='cdone'){var c=S.cmts[+v];var wasHot=c.s==='hot';c.s='done';return toast(wasHot?'Đã mở tin nhắn với '+c.n:'Đã gửi trả lời')}
 if(a==='ask'){S.chat.push({w:'me',t:b.textContent},{w:'ai',t:ANS[+v]});return render()}
 if(a==='send'){var inp=document.getElementById('aiin'),q=(inp.value||'').trim();if(!q)return;S.chat.push({w:'me',t:esc(q)},{w:'ai',t:'Đây là bản xem trước nên em chỉ trả lời các câu bấm sẵn. Bản thật em sẽ làm theo yêu cầu của sếp.'});return render()}
 if(a==='idea'){S.ideas.unshift('Ý tưởng mới: cách chọn sữa rửa mặt cho da nhạy cảm');return toast('Vy đã ghi lại ý tưởng')}
});
render();
})();
</script>
</body>
</html>
